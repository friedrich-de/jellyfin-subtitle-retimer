name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Warnings are errors, so this is also the lint step.
      - name: Build
        run: dotnet build -c Release

      - name: Unit tests
        run: dotnet test -c Release --no-build

      # The end-to-end tests run a real Jellyfin server; its download is kept between runs.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: jellyfin-${{ hashFiles('dev/e2e.sh') }}

      # Jellyfin refuses to start without ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: End-to-end tests in a real Jellyfin server
        run: dev/e2e.sh

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: dist/
          if-no-files-found: error
