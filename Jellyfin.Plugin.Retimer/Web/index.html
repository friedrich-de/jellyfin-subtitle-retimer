<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#202020">
    <title>Subtitle Retimer</title>
    <link rel="manifest" href="Retimer/manifest.webmanifest">
    <link rel="icon" href="Retimer/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="Retimer/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="Retimer/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="Retimer/app.css">
</head>
<body>
    <header class="bar">
        <a class="iconLink" id="homeLink" href="#" title="Back to Jellyfin" aria-label="Back to Jellyfin">&#8592;</a>
        <a class="brand" href="#/">Subtitle Retimer</a>
        <nav class="barLinks" aria-label="Sections">
            <a id="navShows" href="#/">Your shows</a>
            <a id="navActivity" href="#/activity">Activity <span id="activeCount" class="count" hidden></span></a>
            <a id="navSettings" href="#/settings" hidden>Settings</a>
        </nav>
    </header>

    <div id="message" class="message" role="alert" hidden></div>

    <main id="view" tabindex="-1">
        <p class="muted pad">Loading…</p>
    </main>

    <footer class="foot muted">
        <span id="version"></span>
    </footer>

    <dialog id="confirm" class="dialog">
        <form method="dialog">
            <h2 id="confirmTitle"></h2>
            <div id="confirmBody"></div>
            <div class="row end">
                <button class="button" value="cancel" id="confirmCancel">Cancel</button>
                <button class="button primary" value="ok" id="confirmOk">OK</button>
            </div>
        </form>
    </dialog>

    <noscript><p class="pad">This page needs JavaScript.</p></noscript>
    <script src="Retimer/app.js"></script>
</body>
</html>
